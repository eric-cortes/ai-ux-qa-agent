name: CI

# Validation only — no image pushes, no deploys.
# CD skeletons will live in separate workflow files when Dockerfiles exist.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: Install API package
        run: python -m pip install -e apps/api

      - name: Install AI worker deps
        run: python -m pip install pydantic

      - name: Ruff lint
        run: ruff check apps workers

      - name: Ruff format check
        run: ruff format --check apps workers

      - name: Pytest — API
        working-directory: apps/api
        run: python -m pytest -v

      - name: Pytest — AI worker
        working-directory: workers/ai
        run: python -m pytest -v

  node:
    name: Node typecheck + tests + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm build:web

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ./actionlint -color

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan git log — a secret committed
          # then removed is invisible to a shallow clone.
          fetch-depth: 0

      # Uses the gitleaks OSS Docker image directly (no paid license required).
      - name: Run gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --verbose --redact
