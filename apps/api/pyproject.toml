[project]
name = "ai-ux-qa-api"
version = "0.0.1"
description = "FastAPI service for AI UX QA Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.43",
  "psycopg[binary]>=3.2.9",
  "pydantic-settings>=2.10.1",
  "email-validator>=2.2.0",
  "redis>=6.4.0",
  "celery>=5.5.3",
  "httpx>=0.28.1"
]

[tool.uv]
dev-dependencies = []

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
