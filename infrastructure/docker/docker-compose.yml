name: ai-ux-qa-agent
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_ux_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

volumes:
  postgres_data:
